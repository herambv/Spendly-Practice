{% extends "base.html" %}
{% block title %}Analytics — Spendly{% endblock %}

{% block content %}
<section class="analytics-page">
    <div class="analytics-blob analytics-blob--tl"></div>
    <div class="analytics-blob analytics-blob--br"></div>

    <div class="analytics-card">
        <div class="analytics-corner analytics-corner--tr"></div>
        <div class="analytics-corner analytics-corner--bl"></div>

        <div class="analytics-icon-wrap">
            <div class="analytics-icon-glow"></div>
            <div class="analytics-icon-box">
                <i data-lucide="clock"></i>
            </div>
        </div>

        <div class="analytics-badge">Coming Soon</div>

        <h1 class="analytics-title">Advanced Analytics</h1>

        <p class="analytics-desc">
            We're working on powerful insights and visualizations to help you understand your spending patterns better.
        </p>

        <div class="analytics-footer">
            <div class="analytics-dots">
                <span class="analytics-dot analytics-dot--1"></span>
                <span class="analytics-dot analytics-dot--2"></span>
                <span class="analytics-dot analytics-dot--3"></span>
            </div>
            <p class="analytics-tagline">We're crafting something special</p>
        </div>

        <div class="analytics-card-shadow"></div>
    </div>
</section>
{% endblock %}
